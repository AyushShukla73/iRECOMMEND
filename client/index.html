<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iRECOMMEND - Movie Recommendation App</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="logo">iRECOMMEND</div>
      <nav class="nav">
        <a href="#/" class="nav-link">Home</a>
        <a href="#/movies" class="nav-link">Movies</a>
        <a href="#/tv" class="nav-link">TV</a>
        <a href="#/toprated" class="nav-link">Top Rated</a>
        <a href="#/liked" class="nav-link">Liked</a>
        <a href="#/watchlater" class="nav-link">Watch Later</a>
        <a href="#/watched" class="nav-link">Watched</a>
      </nav>
      <div class="auth">
        <button id="login-btn">Sign In</button>
      </div>
    </header>

    <main class="main">
      <section id="home-section" class="section">
        <h2 class="section-title">Popular Movies</h2>
        <div id="home-grid" class="movie-grid">
          <p>Loading movies...</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2024 iRECOMMEND. All rights reserved.</p>
    </footer>
  </div>

  <script type="module" src="/app.js"></script>

</html>
